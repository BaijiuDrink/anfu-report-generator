name: CI - Python 安服报告生成工具

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install black flake8

    - name: Check code format with Black
      run: black --check --diff . || echo "⚠️ Black 格式检查不通过（建议本地运行 black .）"

    - name: Lint code with Flake8
      run: |
        flake8 . --max-line-length=120 \
                 --extend-ignore=E501,E402,E203,F401,F541 \
                 || echo "⚠️ Flake8 检查发现警告（已放宽常见问题）"

    - name: Test import and basic run
      env:
        PYTHONIOENCODING: utf-8
      run: |
        chcp 65001 >nul
        python -c "
        import sys
        sys.stdout.reconfigure(encoding='utf-8')
        import report_generator
        print('✅ report_generator 导入成功')
        import gui_app
        print('✅ gui_app 导入成功')
        import vuln_manager
        print('✅ vuln_manager 导入成功')
        print('🎉 基本导入测试通过')
        "