name: CI - Python 安服报告生成工具

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest   

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.7'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test run the main scripts
      run: |
        python -c "import report_generator; print('report_generator 导入成功')"
        python -c "import gui_app; print('gui_app 导入成功')"
        echo "✅ 基本导入测试通过"